# Centralized build configuration used by build.sh, download.sh and the GitHub workflow.
# Keep values as plain scalars or comma-separated lists.
#
# ---------------------------------------------------------------------------
# GeoServer 3.0.1 / Java 21 / Tomcat 11
# ---------------------------------------------------------------------------
# GeoServer 3.0 moved to Jakarta EE Servlet 6.1, so it REQUIRES Tomcat 11.0.x
# (Tomcat 9 and 10.1 are not supported) and Java 17+ (21 used here).
#
# tomcat_image is noble-based (Ubuntu 24.04). Ubuntu 24.04 ships GDAL 3.8.4,
# which is what `apt-get install gdal-bin` pulls inside the image, so
# gdal_version MUST stay aligned with the distro of tomcat_image or the JNI
# libraries copied from the osgeo/gdal image will not match libgdal.
gs_version: 3.0.1
tomcat_image: 11.0.27-jdk21-temurin-noble
gdal_version: 3.8.4
gdal_native: true
tomcat_extras: false
# Target architecture for the image. One value per build/push:
#   linux/amd64     -> publishes tag <gs_version>-amd64
#   linux/arm64/v8  -> publishes tag <gs_version>-arm64
# Switch this line and push again to publish the other architecture.
build_platform: linux/amd64

# ARM64 variant (same versions, different platform):
#build_platform: linux/arm64/v8

docker_image: thinkwhere/geoserver
docker_tag: auto
docker_label: org.opencontainers.image.vendor=thinkWhere

# Stable GeoServer extension plugins (comma-separated).
# Downloaded from SourceForge as geoserver-<gs_version>-<name>-plugin.zip
plugins: control-flow,css,monitor,gwc-s3,vectortiles,ogcapi-features,gdal,image,arcgrid

# Community GeoServer plugins (comma-separated).
# Not published on SourceForge: taken from build.geoserver.org nightly builds.
community_plugins: cog-s3
